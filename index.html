         bundle loads, so the header-black-fill styling a few lines down
         can apply the instant .mainbar-wrap first appears in the DOM.
         Without this, the fill only existed in Header.jsx's own component
         CSS, which (Vite dev-mode component styles are injected by the JS
         module that imports them, not present in this static shell) isn't
         in the document until the React/Header bundle has downloaded,
         parsed, and run -- on a slow connection that gap was long enough
         for the header to visibly paint white first, then snap to black.
         Mirrors Header.jsx's own hasDarkTopHeader route list exactly; keep
         both in sync if that list ever changes. -->

        if (path !== '/' && path !== '/contact-us' && path !== '/schedule-free-demo') {
          document.documentElement.classList.add('cs-dark-header-route')
        }
      })()
    </script>

    <style>
      /* Pre-React loading indicator: same design as src/components/CloneLoader.jsx
         (used by RouteFallback.jsx for lazy route chunks), reimplemented here as
         plain HTML/CSS/SVG since this must render before React or any JS bundle has
         loaded. Prefixed cs-shell-* (distinct from CloneLoader's cl-loader-*
         classes) to keep the two implementations independent -- this element is
         never touched by React, only ever shown/hidden via the body class below.
         Asset-free by design (inline SVG mark, no <img>) so it never waits on a
         network request before it can render.

         Opaque background is deliberate: this must be the ONLY thing on screen
         while anything is still loading (JS bundle, the first route's lazy
         chunk, that page's own CSS + fonts) -- not the header/footer with an
         invisible content gap behind it. See the closing <script> below for how
         its hide is timed to the same "fully ready" signal that reveals
         .content, instead of React's first paint. */
      #cs-shell-loader {
        display: none;
        position: fixed;
        inset: 0;
        /* Explicit viewport height on top of inset:0 -- dvh tracks Chrome
           Android's collapsing URL bar, so the centred content stays on the
           optical centre of what the user actually sees during load rather
           than the centre of the taller large-viewport box. */
        height: 100dvh;
        z-index: 2147483646;
        background: #fff;
        align-items: center;
        justify-content: center;
        /* The exit animation below scales the inner block several times its
           own size. Without clipping, the enlarged rings and label spill out
           as stray fragments scattered around the screen -- on a narrow phone
           that reads as a broken, off-centre loader rather than a zoom-out. */
        overflow: hidden;
      }

      body.clonescript-page-styles-loading #cs-shell-loader,
      #cs-shell-loader.cs-shell-loader--exiting {
        display: flex;
      }

      /* Exit transition: the core zooms outward past the edges of the
         screen while everything fades, reading as the brand color opening
         up into the page rather than the loader just vanishing. Triggered
         by adding this class (see the closing <script> below) BEFORE the
         loader is actually hidden with display:none, so the animation has
         time to play -- the body class this whole shell keys off of is
         already gone by that point, hence needing the class-based display
         override above to keep it painted throughout. */
      .cs-shell-loader--exiting {
        animation: cs-shell-exit-fade 0.7s ease forwards;
        pointer-events: none;
      }

      .cs-shell-loader--exiting .cs-shell-loader-inner {
        animation: cs-shell-exit-zoom 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes cs-shell-exit-zoom {
        0%   { transform: scale(1); opacity: 1; }
        45%  { transform: scale(2.6); opacity: 1; }
        100% { transform: scale(7); opacity: 0; }
      }

      @keyframes cs-shell-exit-fade {
        0%, 55% { opacity: 1; }
        100%    { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cs-shell-loader--exiting,
        .cs-shell-loader--exiting .cs-shell-loader-inner {
          animation: cs-shell-exit-fade-reduced 0.3s ease forwards;
        }

        @keyframes cs-shell-exit-fade-reduced {
          from { opacity: 1; }
          to   { opacity: 0; }
        }
      }

      .cs-shell-loader-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        animation: cs-shell-enter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes cs-shell-enter {
        from { opacity: 0; transform: scale(0.82); }
        to   { opacity: 1; transform: scale(1); }
      }

      .cs-shell-glow {
        position: absolute;
        top: 44%;
        left: 50%;
        width: 240px;
        height: 240px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(139, 92, 246, 0.38), rgba(56, 189, 248, 0.2) 45%, transparent 72%);
        border-radius: 50%;
        animation: cs-shell-breathe 3s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes cs-shell-breathe {
        0%, 100% { transform: translate(-50%, -50%) scale(0.88); opacity: 0.55; }
        50%      { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
      }

      .cs-shell-ring-wrap {
        position: relative;
        width: 112px;
        height: 112px;
        z-index: 1;
      }

      .cs-shell-sparks {
        position: absolute;
        inset: -16px;
        animation: cs-shell-spin 2.8s linear infinite;
      }

      .cs-shell-spark {
        position: absolute;
        top: 0;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-radius: 50%;
        background: linear-gradient(160deg, #8b5cf6, #38bdf8);
        box-shadow: 0 0 6px rgba(139, 92, 246, 0.7);
        animation: cs-shell-spark-fade 2.8s ease-in-out infinite;
      }

      .cs-shell-spark--2 { top: auto; bottom: 6%; left: auto; right: 2%; animation-delay: -0.93s; }
      .cs-shell-spark--3 { top: auto; bottom: 6%; left: 2%; animation-delay: -1.86s; }

      @keyframes cs-shell-spark-fade {
        0%, 100% { opacity: 0; transform: scale(0.3); }
        50%      { opacity: 1; transform: scale(1); }
      }

      .cs-shell-ring {
        position: absolute;
        border-radius: 50%;
      }

      .cs-shell-ring--outer {
        inset: 0;
        background: conic-gradient(from 0deg, rgba(139, 92, 246, 0) 0deg, #8b5cf6 100deg, #38bdf8 220deg, rgba(56, 189, 248, 0) 320deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
        animation: cs-shell-spin 1.6s linear infinite;
      }

      .cs-shell-ring--inner {
        inset: 15px;
        opacity: 0.85;
        background: conic-gradient(from 180deg, rgba(255, 159, 64, 0) 0deg, #38bdf8 140deg, #8b5cf6 260deg, rgba(139, 92, 246, 0) 340deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
        animation: cs-shell-spin-rev 2.3s linear infinite;
      }

      @keyframes cs-shell-spin { to { transform: rotate(360deg); } }
      @keyframes cs-shell-spin-rev { to { transform: rotate(-360deg); } }

      .cs-shell-core {
        position: absolute;
        inset: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #a78bfa, #8b5cf6 45%, #38bdf8 100%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: cs-shell-pulse 1.8s ease-in-out infinite;
      }

      .cs-shell-mark {
        width: 58%;
        height: 58%;
        display: block;
      }

      @keyframes cs-shell-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 1px rgba(16, 27, 72, 0.04), 0 6px 20px -4px rgba(139, 92, 246, 0.45); }
        50%      { transform: scale(1.07); box-shadow: 0 0 0 1px rgba(16, 27, 72, 0.04), 0 10px 28px -4px rgba(56, 189, 248, 0.55); }
      }

      .cs-shell-loader-label {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: baseline;
        gap: 3px;
        font: 600 14.5px/1.4 system-ui, -apple-system, sans-serif;
      }

      .cs-shell-label-text {
        background: linear-gradient(90deg, #101b48 0%, #101b48 20%, #8b5cf6 40%, #38bdf8 55%, #101b48 75%, #101b48 100%);
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: cs-shell-shimmer 2.6s linear infinite;
      }

      @keyframes cs-shell-shimmer { to { background-position: -220% center; } }

      .cs-shell-dots { display: inline-flex; gap: 3px; margin-left: 1px; }

      .cs-shell-dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #8b5cf6;
        animation: cs-shell-dot-fade 1.4s ease-in-out infinite;
      }

      .cs-shell-dots span:nth-child(2) { animation-delay: 0.2s; background: #7dd3fc; }
      .cs-shell-dots span:nth-child(3) { animation-delay: 0.4s; background: #38bdf8; }

      @keyframes cs-shell-dot-fade {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
        40%           { opacity: 1; transform: translateY(-2px); }
      }

      @media (max-width: 767px) {
        .cs-shell-ring-wrap { width: 92px; height: 92px; }
        .cs-shell-ring--inner { inset: 12px; }
        .cs-shell-core { inset: 23px; }
        .cs-shell-glow { width: 190px; height: 190px; }

        /* The desktop zoom is sized against a viewport many times wider than
           a phone's -- at 7x the mark alone is wider than the screen, so the
           reveal lands as a wall of colour instead of an opening. Scale the
           whole move down to match the smaller canvas. */
        .cs-shell-loader--exiting .cs-shell-loader-inner {
          animation-name: cs-shell-exit-zoom-sm;
        }
      }

      @keyframes cs-shell-exit-zoom-sm {
        0%   { transform: scale(1); opacity: 1; }
        45%  { transform: scale(1.5); opacity: 1; }
        100% { transform: scale(2.6); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cs-shell-loader-inner,
        .cs-shell-glow,
        .cs-shell-ring--outer,
        .cs-shell-ring--inner,
        .cs-shell-core,
        .cs-shell-sparks,
        .cs-shell-spark,
        .cs-shell-label-text,
        .cs-shell-dots span {
          animation: none !important;
        }
      }

      /* Mirrors Header.css's .mainbar-wrap.header-dark-top rules exactly
         (background + nav text/toggle-bar colors) so there is nothing left
         for that stylesheet to visibly change once it loads -- this class
         is present before either bundle exists (see the inline script
         above), so .mainbar-wrap gets it the instant React first renders
         the header, closing the white-flash gap described there. */
      html.cs-dark-header-route .mainbar-wrap {
        background: #06060f !important;
      }

      html.cs-dark-header-route .mainbar-wrap #primary-nav > li > a,
      html.cs-dark-header-route .mainbar-wrap #primary-nav .link-txt .txt {
        color: rgba(255, 255, 255, 0.86) !important;
      }

      html.cs-dark-header-route .mainbar-wrap .navbar-toggle .bar {
        background-color: rgba(255, 255, 255, 0.86) !important;
      }
    </style>

    <script>
      // The rocket above must stay up as the ONLY thing on screen for the
      // *entire* first load -- not just until React mounts something. React
      // committing its first paint only means the JS bundle executed; it says
      // nothing about whether the matched route's lazy chunk has arrived or
      // whether that page's own CSS + fonts (usePageStylesheets.js) have
      // loaded. Hiding this early used to leave a gap where the header/footer
      // were visible around a blank, invisible .content placeholder with no
      // rocket at all until those finished.
      //
      // usePageStylesheets.js already tracks exactly that "is anything still
      // loading" state via the `clonescript-page-styles-loading` body class --
      // the same class this file sets by default below, and the same class
      // whose removal is what reveals each page's .content. So this just
      // waits for that class to be removed for the first time, then hides the
      // shell rocket for good, so the CSS rule above and this script always
      // agree on when it's safe to reveal what's underneath.
      //
      // Deliberately one-shot: later in-app route changes re-add this class
      // (see Layout.jsx/expectPageStyles) so the page can be re-hidden while
      // its new stylesheet loads, but that transition already has its own
      // lighter treatment (.content fades in once ready) -- it should not
      // bring back a full-screen loader every time.
      //
      // Two timing guarantees on top of the base "wait for loading to end"
      // logic, both requested so the loader reads as an intentional moment
      // instead of a flash: MIN_VISIBLE_MS holds it on screen a little even
      // when the page loads instantly (otherwise a fast connection never
      // sees the animation at all), then EXIT_MS is how long the zoom-out
      // reveal (see .cs-shell-loader--exiting above) gets to play before the
      // element is actually removed with display:none.
      (function () {
        var loader = document.getElementById('cs-shell-loader')
        if (!loader) return
        var MIN_VISIBLE_MS = 600
        var EXIT_MS = 700
        var shownAt = performance.now()
        var exitTimer = null
        function hide() { loader.style.display = 'none' }
        function startExit() {
          loader.classList.add('cs-shell-loader--exiting')
          window.setTimeout(hide, EXIT_MS)
        }
        function stillLoading() { return document.body.classList.contains('clonescript-page-styles-loading') }
        // Kept observing indefinitely (not disconnected after the first event)
        // and re-checks stillLoading() again right before it actually starts
        // the exit animation. The class can toggle off then back on in the
        // gap between "loading looked done" and the delayed exit firing --
        // e.g. React 18 StrictMode double-invokes effects in dev, briefly
        // dropping activeLoads to empty and re-adding it a tick later. A
        // one-shot observer would hide the loader on its stale schedule
        // while the page underneath was still mid-load, flashing unstyled
        // content. Re-verifying at fire time, and cancelling a scheduled
        // exit if loading resumes first, closes that gap.
        function scheduleExitIfDone() {
          if (stillLoading()) {
            if (exitTimer) {
              window.clearTimeout(exitTimer)
              exitTimer = null
            }
            return
          }
          if (exitTimer) return
          var wait = Math.max(0, MIN_VISIBLE_MS - (performance.now() - shownAt))
          exitTimer = window.setTimeout(function () {
            exitTimer = null
            if (stillLoading()) return
            startExit()
          }, wait)
        }
        if (!stillLoading()) { hide(); return }
        new MutationObserver(scheduleExitIfDone).observe(document.body, { attributes: true, attributeFilter: ['class'] })
      })()
    </script>
